name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p dist
          cp index.html CNAME dist/
          cp -r assets dist/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML
        run: npx --yes html-validate index.html

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml index.html
          fail: true

  web3forms-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Web3Forms access key is configured
        run: |
          if grep -q 'YOUR_WEB3FORMS_ACCESS_KEY' index.html; then
            echo "::error::Web3Forms access_key is still the placeholder value — the contact form cannot send mail"
            exit 1
          fi
          if ! grep -qE 'name="access_key" value="[0-9a-f-]{10,}"' index.html; then
            echo "::error::Web3Forms access_key field is missing or malformed"
            exit 1
          fi

  heatmap-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub contribution chart renders real content
        run: |
          SIZE=$(curl -s -o /tmp/chart.svg -w '%{size_download}' "https://ghchart.rshah.org/7ea8ff/RossMalcolm")
          echo "Downloaded $SIZE bytes"
          if [ "$SIZE" -lt 2048 ]; then
            echo "::error::GitHub contribution chart response is suspiciously small ($SIZE bytes) — the service may be down or returning a broken/empty chart"
            exit 1
          fi

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    runs-on: ubuntu-latest
    needs: [build, validate-html, check-links, web3forms-check, heatmap-check, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
